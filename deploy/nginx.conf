# =========================================================
# BeatAttend Enterprise Nginx Virtual Host Configuration
# Location: /etc/nginx/sites-available/beattend
# Server Target: Hostinger VPS (76.13.253.114)
# =========================================================

server {
    listen 80;
    listen [::]:80;
    server_name beattend.com www.beattend.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Public Frontend SPA Root
    root /var/www/beattend/current/frontend-dist;
    index index.html;

    # Upload Limits & Timeouts
    client_max_body_size 25M;
    client_body_timeout 30s;
    sendfile on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Public Frontend SPA Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Standalone Executive Dashboard Route
    location /web_dashboard/ {
        alias /var/www/beattend/current/web_dashboard/;
        try_files $uri $uri/ /web_dashboard/index.html;
    }

    # 3. Node.js API Proxy Gateway (Localhost 127.0.0.1:3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_cache_bypass $http_upgrade;
    }

    # 4. Native PHP REST API Route
    location ~ \.php$ {
        root /var/www/beattend/current;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index php_api/api.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_TENANT_ID $http_x_tenant_id;
    }

    # 5. STRICT SECURITY DENIALS (Block Sensitive Files)
    location ~ /\.(env|git|htaccess|svn) {
        deny all;
        return 404;
    }

    location ~ \.(sql|db|log|map|cjs|ts|md|sh)$ {
        deny all;
        return 404;
    }

    location ^~ /backend-dist/ {
        deny all;
        return 404;
    }

    location ^~ /shared/ {
        deny all;
        return 404;
    }
}
