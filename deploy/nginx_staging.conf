server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 76.13.253.114 staging.beattend.com *.beattend.com;

    root /var/www/beattend-staging/current/frontend-dist;
    index index.html;

    access_log /var/www/beattend-staging/logs/nginx_access.log;
    error_log /var/www/beattend-staging/logs/nginx_error.log;

    client_max_body_size 50M;

    # React Frontend SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PHP REST API Routing (/php_api/)
    location /php_api/ {
        alias /var/www/beattend-staging/current/php_api/;
        index api.php index.php;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_read_timeout 300;
        }
    }

    # Node.js API Proxy (/api/)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
