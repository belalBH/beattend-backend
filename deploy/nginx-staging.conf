# =========================================================
# BeatAttend Staging Environment Nginx Configuration
# Location: /etc/nginx/sites-available/beattend-staging
# Target Domain: 76.13.253.114 & staging.beattend.com
# Security: Basic Authentication Protected
# =========================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 76.13.253.114 staging.beattend.com srv1834150.hstgr.cloud _;

    # Staging Basic Authentication Protection
    auth_basic "BeatAttend Staging Area - Restricted Access";
    auth_basic_user_file /etc/nginx/staging_htpasswd;

    # Public Staging Frontend Root
    root /var/www/beattend-staging/current/frontend-dist;
    index index.html;

    client_max_body_size 25M;

    # 1. Public Staging SPA Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Standalone Executive Dashboard Route
    location /web_dashboard/ {
        alias /var/www/beattend-staging/current/web_dashboard/;
        try_files $uri $uri/ /web_dashboard/index.html;
    }

    # 3. Staging Node.js API Gateway Proxy (Internal Port 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
    }

    # 4. Staging Native PHP REST API Route
    location ~ \.php$ {
        root /var/www/beattend-staging/current;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index php_api/api.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_TENANT_ID $http_x_tenant_id;
    }

    # 5. STRICT SECURITY DENIALS
    location ~ /\.(env|git|htaccess) { deny all; return 404; }
    location ~ \.(sql|db|log|map|cjs|ts|md|sh)$ { deny all; return 404; }
    location ^~ /backend-dist/ { deny all; return 404; }
    location ^~ /shared/ { deny all; return 404; }
}
